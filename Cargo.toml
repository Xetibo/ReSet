[package]
name = "reset"
version = "2.0.0"
edition = "2021"
description = "A wip universal Linux settings application."
repository = "https://github.com/Xetibo/ReSet"
license = "GPL-3.0-or-later"

[[bin]]
name = "ReSet"
path = "src/main.rs"

[dependencies]
#reset_daemon = "2.2.0"
reset_daemon = { git = "https://github.com/Xetibo/ReSet-Daemon.git", branch = "dashie-2" }
#re_set-lib = "5.2.5"
re_set-lib = { git = "https://github.com/Xetibo/ReSet-Lib.git", branch = "dashie-2" }
adw = { version = "0.7.1", package = "libadwaita", features = ["v1_4"] }
dbus = "0.9.7"
gtk = { version = "0.9.5", package = "gtk4", features = ["v4_12"] }
glib = "0.20.7"
tokio = { version = "1.36.0", features = [
	"rt",
	"time",
	"net",
	"macros",
	"rt-multi-thread",
	"sync",
] }
fork = "0.2.0"
ipnetwork = "0.21.1"

[build-dependencies]
glib-build-tools = "0.20.0"
